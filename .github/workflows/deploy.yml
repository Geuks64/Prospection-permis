# Déploie l'appli sur Cloudflare Pages → https://hodemolition.pages.dev
# - automatiquement à chaque push sur main ;
# - à la main (bouton « Run workflow ») ;
# - à la fin du robot de collecte (robot.yml), pour publier les nouvelles données.
# Secrets GitHub requis : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_PASSWORD.
name: Déploiement Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJET: hodemolition
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ref: main → toujours la dernière version (y compris les données que le robot vient d'ajouter)
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Vérification du code (TypeScript)
        run: npx tsc --noEmit

      # Stockage KV du suivi des prospects : créé au premier déploiement, puis réutilisé.
      - name: Stockage KV du suivi (création si besoin)
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          NOM="prospection-permis-suivi"
          ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" \
            | jq -r --arg n "$NOM" '.result[]? | select(.title==$n) | .id' | head -n1)
          if [ -z "$ID" ]; then
            ID=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"title\":\"$NOM\"}" "$API" | jq -r '.result.id // empty')
            [ -n "$ID" ] && echo "Stockage KV créé."
          fi
          if [ -z "$ID" ]; then
            echo "::error::Impossible de créer le stockage KV (droit 'Workers KV Storage : Edit' manquant sur le token Cloudflare ?)"
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "SUIVI"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "Stockage KV branché."

      # Le code du serveur (TypeScript) devient public/_worker.js (mode « avancé » de Pages)
      - name: Compilation du serveur
        run: npx esbuild src/index.ts --bundle --format=esm --outfile=public/_worker.js

      - name: Projet Pages (création si besoin)
        run: |
          if npx wrangler pages project list 2>/dev/null | grep -qw "$PROJET"; then
            echo "Projet $PROJET déjà créé."
          else
            npx wrangler pages project create "$PROJET" --production-branch main
          fi

      - name: Mot de passe de l'appli
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: printf '%s' "$APP_PASSWORD" | npx wrangler pages secret put APP_PASSWORD --project-name "$PROJET"

      - name: Déploiement
        run: npx wrangler pages deploy --project-name "$PROJET" --branch main --commit-dirty=true

      - name: Adresse de l'appli
        run: |
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJET" \
            | jq -r '.result.subdomain // empty')
          echo "Appli en ligne : https://$SUB"
          echo "### ✅ Appli en ligne : https://$SUB" >> "$GITHUB_STEP_SUMMARY"
