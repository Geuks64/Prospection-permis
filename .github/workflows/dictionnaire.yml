# Outil : affiche la signification des codes Sitadel (dictionnaires des variables).
name: Dictionnaire des variables

on:
  workflow_dispatch:

jobs:
  dico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd openpyxl
      - run: python3 outils/dictionnaire.py
