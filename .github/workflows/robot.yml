# Robot de collecte : récupère les permis (Sitadel), les ventes (DVF) et les diagnostics
# énergie (DPE), met à jour public/data/permis.json, puis republie l'appli.
# Tourne tout seul chaque lundi matin (les DPE sont publiés en continu) et à la demande
# (bouton « Run workflow »).
name: Robot de collecte

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # pour enregistrer les nouvelles données dans le dépôt
      issues: write     # pour signaler un problème (ticket « rapport-auto »)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collecte et géocodage
        run: python3 robot.py

      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "robot-prospection"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data donnees
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données : mise à jour du $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Signalement automatique (lu par Claude pour corriger) : alertes de données ou échec
      - name: Ticket si alerte sur les données
        if: always() && hashFiles('alertes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create rapport-auto --repo "$GITHUB_REPOSITORY" --color D93F0B --force || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label rapport-auto \
            --title "⚠️ Robot : alertes sur les données ($(date +%d/%m/%Y))" \
            --body "$(printf 'Run : %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; cat alertes.md)" \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ Robot : alertes sur les données" --body-file alertes.md
      - name: Ticket si le robot a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create rapport-auto --repo "$GITHUB_REPOSITORY" --color D93F0B --force || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label rapport-auto \
            --title "❌ Le robot de collecte a échoué ($(date +%d/%m/%Y))" \
            --body "Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  deploiement:
    needs: collecte
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
