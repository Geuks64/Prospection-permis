# Configuration du Worker Cloudflare (le "serveur" de l'appli).
name = "hodemolition"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Fichiers de l'appli (page, script, données). run_worker_first : chaque demande passe
# d'abord par le code (vérification du mot de passe) avant de servir un fichier.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Journaux visibles dans le tableau de bord Cloudflare (Workers > hodemolition > Logs)
[observability]
enabled = true

# - Le stockage KV "SUIVI" (statuts et notes des prospects) est créé et branché
#   automatiquement par le workflow de déploiement (.github/workflows/deploy.yml).
# - Le secret APP_PASSWORD n'est PAS ici : il est envoyé par le workflow de déploiement
#   (secret GitHub APP_PASSWORD), jamais écrit dans le code.
