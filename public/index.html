<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HO Prospection">
<meta name="theme-color" content="#18181b">
<title>HO Démolition · Prospection</title>
<!-- Journal interne (invisible) : chargé en premier pour attraper toutes les erreurs -->
<script src="journal.js"></script>
<link rel="stylesheet" href="/lib/leaflet/leaflet.css">
<link rel="stylesheet" href="/lib/leaflet/MarkerCluster.css">
<link rel="stylesheet" href="/lib/leaflet/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icones/icone-180.png">
<link rel="icon" href="/icones/icone-192.png">
</head>
<body>

<!-- En-tête -->
<header class="entete">
  <div class="marque">
    <span id="logo-entete"></span>
    <div>
      <h1>HO <span>Démolition</span></h1>
      <div class="sous-titre" id="infos-donnees">Chargement…</div>
    </div>
  </div>
  <a class="bouton-discret" href="/api/deconnexion">Quitter</a>
</header>

<!-- Réseau : hors-ligne / envois en attente ; nouvelles données disponibles -->
<div class="reseau" id="reseau" hidden></div>
<div class="bandeau" id="maj-dispo" hidden>
  <span>🔄 Nouvelles données disponibles</span>
  <div class="bandeau-actions"><button onclick="location.reload()">Recharger</button></div>
</div>

<!-- Bandeau des nouveautés -->
<div class="bandeau" id="bandeau" hidden>
  <span id="bandeau-texte"></span>
  <div class="bandeau-actions">
    <button id="voir-nouveaux">Voir</button>
    <button id="marquer-vus" class="secondaire">Marquer comme vus</button>
  </div>
</div>

<!-- Onglets -->
<nav class="onglets">
  <button data-onglet="liste" class="actif">📋 Liste</button>
  <button data-onglet="carte">🗺️ Carte</button>
  <button data-onglet="suivi">⭐ Suivi</button>
</nav>

<!-- Recherche + filtres + export -->
<section class="barre">
  <input id="recherche" type="search" placeholder="Commune, rue, société, n° de dossier…" autocomplete="off">
  <button id="bouton-filtres">Filtres <span class="pastille" id="nb-filtres" hidden></span></button>
  <button id="bouton-courriers" title="Préparer les courriers de la liste">✉️</button>
  <button id="bouton-export" title="Exporter la liste en CSV (Excel)">⤓ Excel</button>
</section>

<!-- Choix rapide de la source : tout / permis / ventes -->
<div class="sources" id="sources">
  <button data-source="tout" class="actif">Tout</button>
  <button data-source="permis">🏗️ Permis <small id="nb-permis"></small></button>
  <button data-source="ventes">🏠 Ventes <small id="nb-ventes"></small></button>
  <button data-source="dpe">⚡ DPE <small id="nb-dpe"></small></button>
</div>

<section class="filtres" id="filtres" hidden>
  <div class="groupe"><h3>Intérêt pour HO</h3><div class="puces" data-filtre="interet"></div></div>
  <div class="groupe"><h3>Autour de Toul</h3><div class="puces" data-filtre="rayon"></div></div>
  <div class="groupe"><h3>Départements</h3><div class="puces" data-filtre="deps"></div></div>
  <div class="groupe"><h3>Demandeur</h3><div class="puces" data-filtre="dem"></div></div>
  <div class="groupe"><h3>Type de dossier</h3><div class="puces" data-filtre="types"></div></div>
  <div class="groupe"><h3>Projet</h3><div class="puces" data-filtre="projet"></div></div>
  <div class="groupe"><h3>Chantier</h3><div class="puces" data-filtre="chantier"></div></div>
  <div class="groupe"><h3>Comprend</h3><div class="puces" data-filtre="options"></div></div>
  <div class="groupe"><h3>Autorisé depuis</h3><div class="puces" data-filtre="periode"></div></div>
  <div class="groupe"><h3>Mon suivi</h3><div class="puces" data-filtre="statut"></div></div>
  <div class="groupe">
    <h3>Trier par</h3>
    <select id="tri">
      <option value="chaleur">Les plus intéressants pour HO</option>
      <option value="proche">Les plus proches de Toul</option>
      <option value="recent">Autorisation la plus récente</option>
      <option value="ancien">Autorisation la plus ancienne</option>
      <option value="commune">Commune (A → Z)</option>
      <option value="surface">Plus grande surface créée</option>
    </select>
  </div>
  <div class="filtres-actions">
    <button id="reinitialiser" class="secondaire">Réinitialiser</button>
    <button id="fermer-filtres">Voir les résultats</button>
  </div>
</section>

<div class="compteur" id="compteur"></div>

<main>
  <div id="vue-liste"></div>
  <div id="vue-carte" hidden>
    <div id="carte"></div>
    <button id="me-localiser" class="flottant" title="Me localiser">📍</button>
  </div>
</main>

<!-- Courriers à imprimer (affichés à la place de l'appli) -->
<section id="courriers">
  <div class="barre-courriers">
    <button id="retour-courriers" class="secondaire">← Retour</button>
    <button id="imprimer">🖨️ Imprimer</button>
    <button id="marquer-courriers" class="secondaire">✓ Marquer « Courrier envoyé »</button>
    <div class="sous-titre" id="nb-courriers"></div>
  </div>
  <div id="lettres"></div>
</section>

<!-- Fiche détaillée d'un dossier -->
<div class="voile" id="voile" hidden></div>
<aside class="fiche" id="fiche" hidden aria-modal="true" role="dialog"></aside>

<script src="/lib/leaflet/leaflet.js"></script>
<script src="/lib/leaflet/leaflet.markercluster.js"></script>
<script src="ho.js"></script>
<script src="app.js"></script>
</body>
</html>
